  <script>
  (()=>{
    const root=document.getElementById('charge-verification-v1');
    const data=JSON.parse(root.querySelector('#charge-fault-data').textContent);
    const select=root.querySelector('#charge-fault');let current='normal';
    const set=(id,text)=>{root.querySelector('#'+id).textContent=text;};
    function accept(s){if(s?.modelContent?.lesson==='charging-faults'&&data.some(d=>d.id===s.modelContent.fault))current=s.modelContent.fault;}
    function render(){
      const d=data.find(d=>d.id===current)||data[0];select.value=d.id;
      set('fault-pin','계산된 입력 '+d.Pin.toFixed(2)+' MW');set('fault-eff','계산된 효율 '+d.eta.toFixed(2)+' %');set('fault-link','열회수 '+d.L.toFixed(2)+' MW');
      const rows=d.rows.map(r=>{
        const tr=document.createElement('tr');
        const name=document.createElement('td');name.className='check-name';name.textContent=r.label;
        const value=document.createElement('td');value.className='text-end tabular-nums';value.textContent=r.residual===0?'0 '+r.unit:r.residual.toExponential(2)+' '+r.unit;
        value.dataset.tooltip='허용오차 '+r.limit.toExponential(2)+' '+r.unit;
        const status=document.createElement('td');status.textContent=r.passed?'통과':'실패';if(!r.passed)status.className='text-destructive';
        tr.append(name,value,status);return tr;
      });
      root.querySelector('#fault-checks').replaceChildren(...rows);
      const verdict=root.querySelector('#fault-verdict');verdict.classList.toggle('text-destructive',!d.passed);
      verdict.textContent=(d.passed?'기준 계산 통과':'오류 검출')+' · 전체 '+d.check_count+'개 중 '+d.pass_count+'개 통과';
    }
    select.replaceChildren(...data.map(d=>new Option(d.label,d.id)));accept(window.openai?.widgetState);render();
    select.addEventListener('change',()=>{
      current=select.value;render();
      if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{lesson:'charging-faults',fault:current},privateContent:null})).catch(()=>{});
    });
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){accept(e.detail.globals.widgetState);render();}});
  })();
  </script>
</div>
