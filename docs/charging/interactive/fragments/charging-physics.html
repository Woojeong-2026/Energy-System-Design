  <div class="lesson-title"><h2>조건을 바꾸면 어디가 달라질까?</h2><span class="text-small text-muted">Cantera 3.0.0 · 1 kmol/s CO₂ · 다른 조건은 기준값 고정</span></div>

  <script>
  (()=>{
    const root=document.getElementById('charge-physics-v1');
    const data=JSON.parse(root.querySelector('#charge-physics-data').textContent);
    const ex=root.querySelector('#charge-experiment'), val=root.querySelector('#charge-value'), svg=root.querySelector('#charge-drawing');
    let state={experiment:'pressure',value:5};
    const set=(id,text)=>{root.querySelector('#'+id).textContent=text;};
    const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const signed=n=>(n>=0?'+':'−')+fmt(Math.abs(n),1);
    const selected=()=>data.find(e=>e.id===state.experiment)||data[0];
    function accept(s){
      if(s?.modelContent?.lesson==='charging-physics'){
        const m=s.modelContent,e=data.find(e=>e.id===m.experiment);
        if(e&&e.cases.some(c=>c.value===Number(m.value)))state={experiment:e.id,value:Number(m.value)};
      }
    }
    function save(){
      if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{lesson:'charging-physics',...state},privateContent:null})).catch(()=>{});
    }
    function draw(c){
      const w=Math.max(260,Math.floor(svg.parentElement.clientWidth));
      const left=w*.25,right=w*.75, ow=Math.min(142,w*.30), top=48, bot=128;
      svg.setAttribute('viewBox',`0 0 ${w} 258`);svg.setAttribute('height','258');
      const line=(x1,y1,x2,y2,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="diagram-rule" ${extra}/>`;
      const txt=(x,y,text)=>`<text class="diagram-text" x="${x}" y="${y}" text-anchor="middle">${text}</text>`;
      const heatColor=c.L>0?'var(--viz-series-2)':'var(--border)';
      svg.innerHTML=`<title>충전 열부하와 열회수</title><desc>셀 ${c.Tcell}도, 반응기 ${c.TB}도. 셀 전력 ${fmt(c.W)} MW. 열회수 ${fmt(c.L)} MW.</desc>
        ${txt(left,17,'SOEC')}${txt(right,17,'탄소 반응기')}
        ${txt(left,38,fmt(c.Tcell,0)+' °C')}${txt(right,38,fmt(c.TB,0)+' °C')}
        <rect class="diagram-edge" x="${left-ow/2}" y="${top}" width="${ow}" height="80"/>
        ${line(left-ow*.22,top+7,left-ow*.22,bot-7)}${line(left,top+7,left,bot-7)}${line(left+ow*.22,top+7,left+ow*.22,bot-7)}
        ${txt(left,96,'CO₂ 환원')}
        <path class="diagram-edge" d="M${right-ow/2} 59 Q${right} 38 ${right+ow/2} 59 L${right+ow/2} 118 Q${right} 140 ${right-ow/2} 118Z"/>
        <path class="diagram-rule" d="M${right-ow/2} 59 Q${right} 80 ${right+ow/2} 59"/>
        ${txt(right,97,'탄소 석출')}
        ${line(left+ow/2+8,84,right-ow/2-8,84)}
        <polyline class="diagram-rule" points="${right-ow/2-15},79 ${right-ow/2-8},84 ${right-ow/2-15},89"/>
        ${txt(w/2,72,'5 → 6')}
        ${txt(left,156,'Wcell '+fmt(c.W,1)+' MW')}
        ${txt(left,181,'Qcell '+signed(c.Qcell)+' MW')}
        ${txt(right,156,'Qrx '+signed(c.Qrx)+' MW')}
        ${txt(right,181,'C 저장 1 kmol/s')}
        <line x1="${right}" y1="210" x2="${left}" y2="210" stroke="${heatColor}" stroke-width="2" ${c.L>0?'':'stroke-dasharray="5 5"'}/>
        ${c.L>0?`<polyline points="${left+8},205 ${left},210 ${left+8},215" fill="none" stroke="${heatColor}" stroke-width="2"/>`:''}
        ${txt(w/2,235,'반응기 → 셀  '+fmt(c.L,2)+' MW  · '+(c.L>0?'전달':'차단'))}`;
    }
    function render(){
      const e=selected();ex.value=e.id;
      val.replaceChildren(...e.cases.map(c=>new Option(fmt(c.value,c.value<1?2:0)+(e.unit?' '+e.unit:''),String(c.value))));
      if(!e.cases.some(c=>c.value===state.value))state.value=e.default;
      val.value=String(state.value);const c=e.cases.find(c=>c.value===state.value);
      set('charge-scope',e.scope);set('charge-voltage','Vch '+fmt(c.V,4)+' V');set('charge-hex','HEX 회수열 '+fmt(c.Qhex,2)+' MW');
      set('charge-power',fmt(c.Pin,2)+' MW');set('charge-efficiency',fmt(c.eta,2)+' %');set('charge-circulation',fmt(c.n4,3)+' kmol/s');
      set('charge-detail','반응기−셀 '+fmt(c.TB-c.Tcell,0)+' K · 열회수 문턱 20 K · HEX 최소 온도차 '+fmt(c.dTmin,1)+' K');
      draw(c);
    }
    ex.replaceChildren(...data.map(e=>new Option(e.label,e.id)));
    accept(window.openai?.widgetState);
    ex.addEventListener('change',()=>{state.experiment=ex.value;state.value=selected().default;render();save();});
    val.addEventListener('change',()=>{state.value=Number(val.value);render();save();});
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){accept(e.detail.globals.widgetState);render();}});
    new ResizeObserver(()=>render()).observe(root);
    render();
  })();
  </script>
</div>
